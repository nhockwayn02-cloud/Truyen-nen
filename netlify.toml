[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Background Functions vẫn được Netlify nhận diện theo hậu tố -background.
# Không cần cấu hình timeout trong file này; giới hạn thực tế phụ thuộc gói Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Worker-Token, X-App-Passcode"

# V12.32.14: publish = "." phát cả repo như file tĩnh. Chặn các đường dẫn không phải của app (tests, mã worker, tài liệu, cấu hình).
# force = true để redirect đè lên cả file có thật. Hàm Netlify chạy ở /.netlify/functions/* nên không bị ảnh hưởng.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

